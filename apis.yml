name: Fuego
description: 'Fuego, Inc. (maker of FuegoBPM) was an enterprise business process management
  (BPM) and service-oriented architecture software company founded circa 1999 in Plano,
  Texas. It was backed by Trinity Ventures among others (Series A, 2004) and was acquired
  by BEA Systems in March 2006, where FuegoBPM became the basis of BEA AquaLogic BPM;
  BEA was subsequently acquired by Oracle in 2008 and the technology folded into the
  Oracle BPM product line. Fuego no longer exists as an independent company and publishes
  no live website, developer portal, documentation, or public API surface.'
